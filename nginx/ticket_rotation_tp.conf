# TP — session-ticket key rotation lists more than one key file.
# CVE-2026-97629 exposure condition. No key material. The uninitialized key is not reproduced.
server {
    listen 443 ssl;
    ssl_session_tickets on;
    ssl_session_ticket_key /etc/nginx/tickets/current.key;
    ssl_session_ticket_key /etc/nginx/tickets/previous.key;
}
